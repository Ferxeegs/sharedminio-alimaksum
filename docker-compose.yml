services:
  # Image Chainguard jalan sebagai UID 65532. Data lama dari image root tidak bisa ditulis.
  minio-perms:
    image: alpine:3.21
    container_name: sharedminio-minio-perms
    user: "0:0"
    volumes:
      - ${MINIO_DATA_PATH}:/data
    networks:
      - sharedminio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        owner="$$(stat -c '%u' /data)"
        if [ "$$owner" != "65532" ]; then
          echo "Fixing /data ownership for MinIO user 65532 (was $$owner)"
          chown -R 65532:65532 /data
        fi
    restart: "no"

  minio:
    # quay.io/minio/minio menolak pull anonim (401). Image ini tetap MinIO S3 API.
    image: cgr.dev/chainguard/minio:latest
    container_name: sharedminio-minio
    command: server /data --console-address ":9001"
    depends_on:
      minio-perms:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - ${MINIO_DATA_PATH}:/data
    networks:
      - sharedminio
    restart: unless-stopped
    healthcheck:
      # Image Chainguard tidak punya curl. Bash /dev/tcp memeriksa /minio/health/live.
      test:
        - CMD
        - /bin/sh
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && IFS= read -r line <&3 && case "$$line" in *"200 OK"*) exit 0;; *) exit 1;; esac'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # S3 API :9000 and Console :9001 are published on the host only.
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-init:
    # quay.io/minio/mc menolak pull anonim (401). Tag -dev punya shell untuk init script.
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: sharedminio-minio-init
    depends_on:
      minio:
        condition: service_started
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/init-minio.sh"]
    networks:
      - sharedminio
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: sharedminio-prometheus
    depends_on:
      - minio
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - sharedminio
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: sharedminio-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - sharedminio
    restart: unless-stopped

networks:
  sharedminio:
    name: sharedminio-alimaksum

volumes:
  prometheus-data:
  grafana-data:
